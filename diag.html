<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:monospace;padding:12px;font-size:12px">
<pre id="o">Loading...</pre>
<script type="module">
const o = document.getElementById("o");
const log = t => o.textContent += "\n" + t;
try {
  const t = await (await fetch("./qpdf.js")).text();
  o.textContent = "LENGTH: " + t.length +
    "\n\nSTART:\n" + t.slice(0, 300) +
    "\n\nEND:\n" + t.slice(-300);
  try {
    const m = await import("./qpdf.js?d=" + Date.now());
    log("\nMODULE KEYS: " + Object.keys(m).join(","));
    log("DEFAULT TYPE: " + typeof m.default);
    if (m.default) log("DEFAULT KEYS: " + Object.getOwnPropertyNames(m.default).slice(0, 30).join(","));
  } catch (e) { log("\nIMPORT ERROR: " + e.message); }
} catch (e) { o.textContent = "FETCH ERROR: " + e.message; }
</script>
</body>
