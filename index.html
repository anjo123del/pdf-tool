<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Password Tool</title>
<body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
<h2>PDF Password Tool</h2>
<input type="file" id="f" accept="application/pdf"><br><br>
<input id="cur" type="password" placeholder="Current password"><br><br>
<select id="mode">
  <option value="remove">Remove password</option>
  <option value="change">Change password</option>
</select><br><br>
<input id="new" type="password" placeholder="New password (if changing)"><br><br>
<button id="go">Process &amp; Save</button>
<p id="msg"></p>
  <script>document.getElementById("msg").textContent="Page v2 loaded";</script>


<button id="save" style="display:none">Save file</button>
<script type="module">
const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;
window.onerror = (m) => msg("Error: " + m);
let result = null;

$("go").onclick = async () => {
  try {
    const file = $("f").files[0];
    if (!file) return msg("Pick a PDF first.");
    msg("Loading engine...");
    if (!window.QModule) {
  await new Promise((res, rej) => {
    window.Module = {
      locateFile: () => "./qpdf.wasm",
      noInitialRun: true,
      onRuntimeInitialized: () => res()
    };
    const s = document.createElement("script");
    s.src = "./qpdf.js";
    s.onerror = () => rej(new Error("qpdf.js not found"));
    document.body.appendChild(s);
  });
  window.QModule = window.Module;
}
const q = window.QModule;

    const args = ["--password=" + $("cur").value];
    if ($("mode").value === "remove") {
      args.push("--decrypt", "/in.pdf", "/out.pdf");
    } else {
      const p = $("new").value;
      args.push("--encrypt", p, p, "256", "--", "/in.pdf", "/out.pdf");
    }
    q.callMain(args);
    const out = q.FS.readFile("/out.pdf");
    result = new File([out], file.name, { type: "application/pdf" });
    $("save").style.display = "inline";
    msg("Done. Tap Save file.");
  } catch (e) {
    msg("Failed: " + (e.message || e));
  }
};

$("save").onclick = async () => {
  try {
    await navigator.share({ files: [result] });
  } catch (e) {
    msg("Share failed: " + (e.message || e));
  }
};
</script>
